field_definitions:
- key: EMAIL_MESSAGE.Full Name
  label: Full Name
  type: string
  required: true
  hint: Full name of the client as the text states it, copied as written.
- key: EMAIL_MESSAGE.Employer
  label: Employer
  type: string
  required: true
  hint: Employer or company the client works for. "I work at Acme" gives Acme. Copy it as written.
- key: EMAIL_MESSAGE.Employment Start
  label: Employment Start
  type: date
  required: true
  hint: Employment start date, written YYYY-MM-DD, when the text gives the full date. An approximate date written like "about 2025-06-01" or "around 2025-06-01" still counts as a claim. Return the date as written and set nothing else.
- key: EMAIL_MESSAGE.Last Entry
  label: Last Entry
  type: date
  required: true
  hint: Date of the last entry into the country. "My last entry was 2025-06-10" gives 2025-06-10. Written YYYY-MM-DD, only when the text gives the full date.
- key: EMAIL_MESSAGE.Mailing Address
  label: Mailing Address
  type: string
  required: true
  hint: Mailing address. "Mail me at 12 Main St, Town" gives 12 Main St, Town. Copy it as written.
- key: EMAIL_MESSAGE.Date of Birth
  label: Date of Birth
  type: date
  required: true
  hint: Date of birth, written YYYY-MM-DD, only when the text gives the full date.
- key: EMAIL_MESSAGE.Passport Number
  label: Passport Number
  type: string
  required: true
  hint: Passport or travel document number. "Passport number AB123" gives AB123. Copy it exactly.
- key: EMAIL_MESSAGE.Client Question
  label: Client Question
  type: string
  required: true
  hint: A question the client asks, copied as written. Do not answer it and do not give legal advice.
- key: EMAIL_MESSAGE.Sender
  label: Sender
  type: string
  required: true
  hint: Sender of the email as written in the From line, copied as written.
- key: EMAIL_MESSAGE.Message Date
  label: Message Date
  type: date
  required: true
  hint: Date of the email, written YYYY-MM-DD, only when the text gives the full date.
note: A communication document. Values are claims, stored with the upload id as their source and never verified as facts. Every field is required in the schema because the model returns far fewer fields when they are optional. A field the text does not state comes back empty and code drops it.
