<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review queue, Variant 2 Split inbox</title>
<link rel="stylesheet" href="base.css">
<style>
.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role .tabs button{padding:4px 12px}
.role .tabs button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,33,58,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;color:var(--ink)}
.chip:hover{background:var(--soft)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip b{font-weight:700;margin-left:4px;opacity:.85}
.split{display:grid;grid-template-columns:minmax(340px,440px) minmax(0,1fr);gap:12px;align-items:start}
.listc{padding:6px;max-height:calc(100vh - 170px);overflow:auto;position:sticky;top:8px}
.row{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:9px 10px;cursor:pointer;border-bottom:1px solid var(--line);border-radius:10px}
.row:hover{background:var(--soft)}
.row[aria-current=true]{background:var(--soft);border-color:var(--accent)}
.row .l1{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row .id{font-weight:700}
.row .l2{margin-top:2px;font-weight:600}
.row .l3{margin-top:2px;color:var(--muted);font-size:12.5px}
.row .sum{margin-top:3px;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .fl{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.flag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;background:var(--warn-soft);color:var(--warn);border:1px solid #ecd28a}
.flag.hold{background:var(--bad-soft);color:var(--bad);border-color:#efb5b0}
.flag.ai{background:var(--ai-soft);color:var(--ai);border-color:#cdbfeb}
.flag.mute{background:var(--soft);color:var(--muted);border-color:var(--line)}
.prev{padding:16px 18px}
.ph{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:flex-start}
.ph .meta{color:var(--muted);margin-top:3px}
.sec{margin-top:16px}
.sec>h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.val{background:var(--soft);border-radius:10px;padding:10px 12px}
.val .cmp{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:8px;font-size:13px}
.val .cmp dt{color:var(--muted)}.val .cmp dd{margin:0}
.ev{display:flex;flex-wrap:wrap;gap:6px}
.ev a{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;color:var(--ink);text-decoration:none}
.ev a:hover{background:var(--soft);text-decoration:underline}
.ev .hidden{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.flags{display:grid;gap:6px}
.flagbox{border-left:4px solid #d99a00;background:var(--warn-soft);border-radius:0 10px 10px 0;padding:7px 10px;font-size:13px}
.flagbox.hold{border-color:var(--bad);background:var(--bad-soft)}
.flagbox.ai{border-color:var(--ai);background:var(--ai-soft)}
.flagbox.mute{border-color:var(--muted);background:var(--soft)}
.flagbox b{display:block}
.quote{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px;margin-top:4px;white-space:pre-wrap}
.draft{border:2px dashed var(--ai);border-radius:10px;padding:8px 12px;background:var(--surface)}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.hist .w{color:var(--muted)}
.decide{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.decide .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn.okb{background:var(--ok)}
.btn.rej{background:var(--bad)}
.btn.warnb{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.err{color:var(--bad);font-size:12.5px;margin-top:4px;min-height:18px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px}
.note a{font-weight:600;color:var(--accent)}
.decided{border-radius:10px;padding:10px 12px;background:var(--soft)}
.decided.rejected{background:var(--bad-soft)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);margin-bottom:4px}
.back{display:none;margin-bottom:8px}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-weight:600;z-index:5}
.sr{position:absolute;left:-9999px}
@media (max-width:900px){
 .split{grid-template-columns:1fr}
 .listc{position:static;max-height:none}
 .back{display:inline-block}
 .hist li{grid-template-columns:1fr}
 .prev{padding:12px}
}
</style></head><body>

var FILT=[['Pending','Waiting for your decision'],['Approved','Approved'],['Sent back','Sent back'],['Rejected','Rejected'],['Committed','Committed'],['All','All']];
var PILL={'Pending':['warn','Pending legal review'],'Approved':['ok','Approved'],'Rejected':['bad','Rejected'],'Sent back':['ai','Sent back'],'Committed':['mute','Committed']};
var filter='Pending',sel=null,role='att';
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pill(s){var p=PILL[s];return '<span class="pill '+p[0]+'">'+p[1]+'</span>'}
function shown(){return P.filter(function(p){return filter==='All'||p.status===filter})}
function count(f){return f==='All'?P.length:P.filter(function(p){return p.status===f}).length}
function flagCls(k){return k==='hold'?'hold':k==='ai'?'ai':k==='mute'?'mute':k==='draft'?'ai':''}
function short(f){return{cal:'Differs from calendar',hold:'Needs care',doc:'Missing or unusable document',draft:'DRAFT, NOT SENT',ai:'Suspicious PDF text',mute:'Earlier rejection kept'}[f]}
function chips(){
 $('#chips').innerHTML=FILT.map(function(f){return '<button type="button" class="chip" aria-pressed="'+(filter===f[0])+'" data-f="'+f[0]+'">'+f[1]+'<b>'+count(f[0])+'</b></button>'}).join('');
 $('#chips').querySelectorAll('button').forEach(function(b){b.onclick=function(){filter=b.dataset.f;sel=null;render()}});
}
function list(){
 var a=shown();
 if(!a.length){$('#list').innerHTML='<div class="empty"><h2>'+(filter==='Pending'?'Nothing is waiting for your decision':'No proposals here')+'</h2><div>'+(filter==='Pending'?'New proposals show up here when operations adds them.':'Pick another filter above.')+'</div></div>';return}
 $('#list').innerHTML=a.map(function(p){
  var fl=p.flags.map(function(f){return '<span class="flag '+flagCls(f[0])+'">'+esc(f[0]==='hold'&&p.restricted?'Restricted matter':short(f[0]))+'</span>'}).join('');
  return '<button type="button" class="row" data-id="'+p.id+'" aria-current="'+(sel===p.id)+'"><div class="l1"><span class="id">'+p.id+'</span>'+pill(p.status)+'</div><div class="l2">'+esc(p.client)+' · '+p.case+'</div><div class="l3">'+p.kind+' · '+esc(p.by)+' · '+esc(p.at)+'</div><div class="sum">'+esc(p.sum)+'</div>'+(fl?'<div class="fl">'+fl+'</div>':'')+'</button>'}).join('');
 $('#list').querySelectorAll('.row').forEach(function(b){b.onclick=function(){sel=b.dataset.id;render();if(matchMedia('(max-width:900px)').matches){$('#prev').scrollIntoView({behavior:'smooth'});$('#prev').focus()}}});
}
function decided(p){
 if(p.status==='Pending')return '';
 var who=p.status==='Sent back'?'Sent back':p.status==='Rejected'?'Rejected':'Approved';
 var h='<div class="decided '+(p.status==='Rejected'?'rejected':'')+'"><b>'+who+' by '+esc(p.rev)+'</b> · '+esc(p.rat)+'<div>Reason: '+esc(p.reason)+'</div>';
 if(p.com)h+='<div class="muted">Committed by '+esc(p.com)+' · '+esc(p.cat)+'</div>';
 return h+'</div>';
}
function controls(p){
 if(role==='ops'){
  var h='<div class="note"><b>Read only.</b> Only the attorney decides. Operations can see this item and apply approved changes.';
  if(p.status==='Approved')h+='<div style="margin-top:6px"><a href="#apply" id="apply">Apply approved changes</a> for '+p.id+'</div>';
  else h+='<div style="margin-top:6px" class="muted">Nothing to apply on this item.</div>';
  return '<div class="sec">'+h+'</div></div>';
 }
 if(p.status!=='Pending')return '<div class="sec">'+decided(p)+'</div>';
 return '<div class="decide"><h3>Your decision</h3><label class="f" for="why" style="margin-top:8px">Reason or note <span class="muted">(required to reject, required to send back)</span></label><textarea id="why" rows="3" placeholder="Write the reason in plain words"></textarea><div class="err" id="err" role="alert"></div><div class="acts"><button type="button" class="btn okb" data-a="Approved">Approve</button><button type="button" class="btn rej" data-a="Rejected">Reject</button><button type="button" class="btn warnb" data-a="Sent back">Send back</button></div><div class="muted" style="margin-top:6px;font-size:12px">Approving changes nothing outside this app. Operations applies it afterward.</div></div>';
}
function prev(){
 var p=P.filter(function(x){return x.id===sel})[0];
 if(!p){$('#prev').innerHTML='<div class="empty"><h2>'+(shown().length?'Pick a proposal':'Nothing to preview')+'</h2><div>'+(shown().length?'Select an item on the left. You can decide without leaving this page.':'The queue is clear.')+'</div></div>';return}
 var h='<button type="button" class="btn quiet back" id="back">Back to list</button><div class="ph"><div><h2>'+p.id+' · '+p.kind+'</h2><div class="meta"><a href="#'+p.case+'">'+p.case+'</a> · '+esc(p.client)+'</div><div class="meta">Proposed by '+esc(p.by)+' · '+esc(p.at)+'</div></div>'+pill(p.status)+'</div>';
 h+='<div class="sec"><h3>What is proposed</h3><div class="val"><b>'+esc(p.value.lead)+'</b>'+(p.value.draft?'<div class="draft" style="margin-top:6px">'+esc(p.value.draft)+'</div>':'')+'<dl class="cmp">'+p.value.rows.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join('')+'</dl></div></div>';
 if(p.flags.length)h+='<div class="sec"><h3>Needs care</h3><div class="flags">'+p.flags.map(function(f){var t=f[0]==='hold'&&p.restricted&&f[1]==='Restricted matter'?f[1]:f[1];return '<div class="flagbox '+flagCls(f[0])+'"><b>'+esc(t)+'</b>'+esc(f[2])+(f[0]==='ai'&&p.quote?'<div class="quote" aria-label="Flagged text, not followed">'+esc(p.quote)+'</div>':'')+'</div>'}).join('')+'</div></div>';
 h+='<div class="sec"><h3>Evidence</h3><div class="ev">'+p.ev.map(function(e){return '<a href="#'+e+'">'+e+'</a>'}).join('')+(p.hidden?'<span class="hidden">'+p.hidden+', details hidden</span>':'')+'</div></div>';
 h+='<div class="sec"><h3>History</h3><ul class="hist">'+p.hist.map(function(x){return '<li><span class="w">'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></li>'}).join('')+'</ul></div>';
 if(p.status!=='Pending'&&role==='ops')h+='<div class="sec">'+decided(p)+'</div>';
