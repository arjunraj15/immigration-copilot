services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: casedesk
      POSTGRES_PASSWORD: casedesk
      POSTGRES_DB: casedesk
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casedesk -d casedesk"]
      interval: 3s
      timeout: 3s
      retries: 20

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    volumes:
      - docling_models:/opt/app-root/src/.cache

  migrate:
    build: ./backend
    image: casedesk-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://casedesk_app:casedesk_app@db:5432/casedesk
      MIGRATION_DATABASE_URL: postgresql+psycopg://casedesk:casedesk@db:5432/casedesk
    command: alembic upgrade head
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: casedesk-backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://casedesk_app:casedesk_app@db:5432/casedesk
      MIGRATION_DATABASE_URL: postgresql+psycopg://casedesk:casedesk@db:5432/casedesk
      STARTER_KIT_DIR: /data/starter-kit
      OCR_URL: http://docling:5001
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - uploads:/app/storage
      - ${STARTER_KIT_DIR:-./data/starter-kit}:/data/starter-kit:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      docling:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  docling_models:
  frontend_node_modules:
