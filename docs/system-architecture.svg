<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" width="1600" height="1120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:#475569"/>
    </marker>
    <style>
      .bg { fill: #F8FAFC; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.4; }
      .zc { fill: #FBF9FF; stroke: #7C5CD6; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .zd { fill: #F7FAFF; stroke: #3B7DD8; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .zh { fill: #FFFBF3; stroke: #D98E04; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .claude { fill: #F3EEFF; stroke: #7C5CD6; stroke-width: 1.4; }
      .code { fill: #EAF2FF; stroke: #3B7DD8; stroke-width: 1.4; }
      .human { fill: #FFF4E0; stroke: #D98E04; stroke-width: 1.4; }
      .data { fill: #E7F7EE; stroke: #16A34A; stroke-width: 1.4; }
      .ext { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.4; }
      .ok { fill: #E7F7EE; stroke: #16A34A; stroke-width: 1.2; }
      .no { fill: #FDECEC; stroke: #DC2626; stroke-width: 1.2; }
      .back { fill: #F1F5F9; stroke: #64748B; stroke-width: 1.2; }
      .chip { fill: #EEF2F7; stroke: #CBD5E1; stroke-width: 1; }
      .step { fill: #1F2937; }
      .title { font-size: 30px; font-weight: 800; fill: #0F172A; }
      .sub { font-size: 15px; fill: #475569; }
      .h { font-size: 17px; font-weight: 800; fill: #0F172A; }
      .zt { font-size: 15px; font-weight: 800; }
      .t { font-size: 14px; font-weight: 700; fill: #0F172A; }
      .s { font-size: 12px; fill: #334155; }
      .m { font-size: 11.5px; fill: #475569; font-style: italic; }
      .c { font-size: 12.5px; fill: #1E293B; text-anchor: middle; font-weight: 600; }
      .w { font-size: 13px; fill: #FFFFFF; text-anchor: middle; font-weight: 700; }
      .lbl { font-size: 11.5px; fill: #334155; font-weight: 600; }
      .tag { font-size: 10.5px; font-weight: 700; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120"/>

  <!-- Title -->
  <text class="title" x="40" y="54">Immigration Case Co-Pilot</text>
  <text class="sub" x="40" y="80">Messy intake in, review-ready case out. Claude reads, code decides, people approve. Every step is audited.</text>

  <!-- Legend -->
  <g transform="translate(1010,34)">
    <rect class="claude" x="0" y="0" width="16" height="16" rx="3"/><text class="s" x="22" y="13">Claude (words and JSON)</text>
    <rect class="code" x="180" y="0" width="16" height="16" rx="3"/><text class="s" x="202" y="13">Deterministic code</text>
    <rect class="human" x="340" y="0" width="16" height="16" rx="3"/><text class="s" x="362" y="13">Human decision</text>
    <rect class="data" x="0" y="28" width="16" height="16" rx="3"/><text class="s" x="22" y="41">Storage</text>
    <rect class="ext" x="180" y="28" width="16" height="16" rx="3"/><text class="s" x="202" y="41">Service or input</text>
  </g>

  <!-- Row A: people and frontend -->
  <rect class="human" x="40" y="110" width="250" height="96" rx="12"/>
  <text class="t" x="58" y="138">Firm staff</text>
  <text class="s" x="58" y="160">OPS-xx prepares and proposes</text>
  <text class="s" x="58" y="178">LEGAL-xx approves or rejects</text>
  <text class="m" x="58" y="196">"Acting as" is a demo control</text>

  <line class="line" x1="290" y1="158" x2="326" y2="158" marker-end="url(#a)"/>

  <rect class="panel" x="330" y="110" width="1230" height="96" rx="12"/>
  <text class="h" x="350" y="136">React 19 frontend</text>
  <text class="s" x="520" y="136">Vite, TypeScript, Tailwind 4, TanStack Query. Every value shows a source chip and a status pill with a reason.</text>
  <g>
    <rect class="chip" x="350" y="152" width="120" height="36" rx="18"/><text class="c" x="410" y="175">Upload</text>
    <rect class="chip" x="482" y="152" width="120" height="36" rx="18"/><text class="c" x="542" y="175">Case queue</text>
    <rect class="chip" x="614" y="152" width="120" height="36" rx="18"/><text class="c" x="674" y="175">Documents</text>
    <rect class="chip" x="746" y="152" width="140" height="36" rx="18"/><text class="c" x="816" y="175">Facts, conflicts</text>
    <rect class="chip" x="898" y="152" width="130" height="36" rx="18"/><text class="c" x="963" y="175">Review queue</text>
    <rect class="chip" x="1040" y="152" width="150" height="36" rx="18"/><text class="c" x="1115" y="175">Ask the case</text>
    <rect class="chip" x="1202" y="152" width="150" height="36" rx="18"/><text class="c" x="1277" y="175">AI management</text>
    <rect class="chip" x="1364" y="152" width="180" height="36" rx="18"/><text class="c" x="1454" y="175">History, /status</text>
  </g>

  <line class="line" x1="945" y1="206" x2="945" y2="244" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="lbl" x="955" y="230">/api with X-Actor header, server enforces permissions</text>

  <!-- Inputs column -->
  <rect class="panel" x="40" y="250" width="250" height="470" rx="12"/>
  <text class="h" x="58" y="278">Inputs (synthetic)</text>
  <g>
    <rect class="ext" x="56" y="294" width="218" height="62" rx="9"/>
    <text class="t" x="70" y="318">PDF uploads</text>
    <text class="s" x="70" y="338">passports, pay slips, letters</text>
    <text class="tag" x="214" y="318" fill="#16A34A">EVIDENCE</text>

    <rect class="ext" x="56" y="366" width="218" height="62" rx="9"/>
    <text class="t" x="70" y="390">Portal events</text>
    <text class="s" x="70" y="410">verified MOCK_PORTAL only</text>
    <text class="tag" x="214" y="390" fill="#16A34A">EVIDENCE</text>

    <rect class="ext" x="56" y="438" width="218" height="62" rx="9"/>
    <text class="t" x="70" y="462">Client profiles</text>
    <text class="s" x="70" y="482">human-verified records</text>
    <text class="tag" x="214" y="462" fill="#16A34A">EVIDENCE</text>

    <rect class="ext" x="56" y="510" width="218" height="62" rx="9"/>
    <text class="t" x="70" y="534">Messages</text>
    <text class="s" x="70" y="554">email, WhatsApp exports</text>
    <text class="tag" x="236" y="534" fill="#64748B">CLAIM</text>

    <rect class="ext" x="56" y="582" width="218" height="62" rx="9"/>
    <text class="t" x="70" y="606">Zoom notes, calendar</text>
    <text class="s" x="70" y="626">what someone said</text>
    <text class="tag" x="236" y="606" fill="#64748B">CLAIM</text>
  </g>
  <text class="m" x="58" y="672">All content is untrusted data.</text>
  <text class="m" x="58" y="690">Instructions inside are flagged,</text>
  <text class="m" x="58" y="708">never followed.</text>

  <line class="line" x1="290" y1="480" x2="326" y2="480" marker-end="url(#a)"/>

  <!-- Backend panel -->
  <rect class="panel" x="310" y="250" width="1250" height="470" rx="12"/>
  <text class="h" x="330" y="278">FastAPI backend</text>
  <text class="s" x="480" y="278">Python 3.12, SQLAlchemy 2, Pydantic 2. Three trust zones. Long work runs as background jobs.</text>

  <!-- Zone 1: Claude -->
  <rect class="zc" x="326" y="292" width="396" height="414" rx="12"/>
  <text class="zt" x="342" y="316" fill="#5B3FB8">1. Claude reads and writes words</text>
  <g>
    <rect class="claude" x="342" y="328" width="364" height="56" rx="9"/>
    <text class="t" x="356" y="351">Prompt registry</text>
    <text class="s" x="356" y="371">versioned prompts in the database, no prompts in code</text>

    <rect class="claude" x="342" y="392" width="364" height="56" rx="9"/>
    <text class="t" x="356" y="415">Document reader</text>
    <text class="s" x="356" y="435">classify, then read_passport, read_pay_statement ...</text>

    <rect class="claude" x="342" y="456" width="364" height="56" rx="9"/>
    <text class="t" x="356" y="479">Conflict explainer</text>
    <text class="s" x="356" y="499">plain-word explanation that cites both sides</text>

    <rect class="claude" x="342" y="520" width="364" height="56" rx="9"/>
    <text class="t" x="356" y="543">Client triage</text>
    <text class="s" x="356" y="563">labels incoming messages, replies come from templates</text>

    <rect class="claude" x="342" y="584" width="364" height="56" rx="9"/>
    <text class="t" x="356" y="607">Case investigation agent</text>
    <text class="s" x="356" y="627">read-only tools, case_id fixed, answers with citations</text>
  </g>
  <text class="m" x="342" y="664">Structured JSON only. Every value carries a quote and page.</text>
  <text class="m" x="342" y="682">No write tools. Runs logged with prompt version and tokens.</text>

  <!-- Zone 2: Code -->
  <rect class="zd" x="742" y="292" width="396" height="414" rx="12"/>
  <text class="zt" x="758" y="316" fill="#1E5BB0">2. Code decides facts and rules</text>
  <g>
    <rect class="code" x="758" y="328" width="364" height="56" rx="9"/>
    <text class="t" x="772" y="351">Ingest and scope</text>
    <text class="s" x="772" y="371">sha256 duplicates, page owner check, quarantine</text>

    <rect class="code" x="758" y="392" width="364" height="56" rx="9"/>
    <text class="t" x="772" y="415">Quote check</text>
    <text class="s" x="772" y="435">value is verified only if its quote is on the page</text>

    <rect class="code" x="758" y="456" width="364" height="56" rx="9"/>
    <text class="t" x="772" y="479">Rules and deadlines</text>
    <text class="s" x="772" y="499">document rules, cross checks, portal event + 10 days</text>

    <rect class="code" x="758" y="520" width="364" height="56" rx="9"/>
    <text class="t" x="772" y="543">Fact engine</text>
    <text class="s" x="772" y="563">one fact per source, conflicts per field, claim vs evidence</text>

    <rect class="code" x="758" y="584" width="364" height="56" rx="9"/>
    <text class="t" x="772" y="607">Proposal builder</text>
    <text class="s" x="772" y="627">checklist, form draft, deadline, reply, idempotency key</text>
  </g>
  <text class="m" x="758" y="664">Permissions, case scoping and date math live here.</text>
  <text class="m" x="758" y="682">Unknown stays unknown. Nothing is invented.</text>

  <!-- Zone 3: Humans -->
  <rect class="zh" x="1158" y="292" width="386" height="414" rx="12"/>
  <text class="zt" x="1174" y="316" fill="#9A6400">3. People make every legal call</text>
  <g>
    <rect class="human" x="1174" y="328" width="354" height="56" rx="9"/>
    <text class="t" x="1188" y="351">OPS proposes</text>
    <text class="s" x="1188" y="371">status PENDING_LEGAL_REVIEW</text>

    <line class="line" x1="1351" y1="384" x2="1351" y2="400" marker-end="url(#a)"/>

    <rect class="human" x="1174" y="402" width="354" height="56" rx="9"/>
    <text class="t" x="1188" y="425">LEGAL reviews</text>
    <text class="s" x="1188" y="445">sees quotes, sources and conflicts side by side</text>

    <line class="line" x1="1236" y1="458" x2="1236" y2="476" marker-end="url(#a)"/>
    <line class="line" x1="1351" y1="458" x2="1351" y2="476" marker-end="url(#a)"/>
    <line class="line" x1="1466" y1="458" x2="1466" y2="476" marker-end="url(#a)"/>

    <rect class="ok" x="1174" y="478" width="110" height="44" rx="8"/>
    <text class="c" x="1229" y="505">APPROVED</text>
    <rect class="no" x="1296" y="478" width="110" height="44" rx="8"/>
    <text class="c" x="1351" y="505">REJECTED</text>
    <rect class="back" x="1418" y="478" width="110" height="44" rx="8"/>
    <text class="c" x="1473" y="505">SENT_BACK</text>

    <line class="line" x1="1229" y1="522" x2="1229" y2="550" marker-end="url(#a)"/>

    <rect class="human" x="1174" y="552" width="354" height="56" rx="9"/>
    <text class="t" x="1188" y="575">OPS commits</text>
    <text class="s" x="1188" y="595">refused unless APPROVED, then COMMITTED</text>
  </g>
  <text class="m" x="1174" y="646">A rejection is permanent until a person</text>
  <text class="m" x="1174" y="664">changes it. Reruns never overwrite it.</text>
  <text class="m" x="1174" y="682">Nothing is filed or sent to anyone.</text>

  <!-- Cross-zone arrows -->
  <line class="line" x1="706" y1="420" x2="756" y2="420" marker-end="url(#a)"/>
  <rect x="712" y="398" width="40" height="15" rx="3" fill="#FFFFFF"/>
  <text class="lbl" x="732" y="410" font-size="10.5" text-anchor="middle">JSON</text>
  <line class="line" x1="758" y1="488" x2="708" y2="488" marker-end="url(#a)"/>
  <rect x="706" y="466" width="52" height="15" rx="3" fill="#FFFFFF"/>
  <text class="lbl" x="732" y="478" font-size="10.5" text-anchor="middle">explain</text>
  <path class="line" d="M1122,612 H1148 V356 H1172" marker-end="url(#a)"/>
  <rect x="1140" y="440" width="16" height="76" rx="3" fill="#FFFFFF"/>
  <text class="lbl" x="1152" y="478" font-size="10.5" text-anchor="middle" transform="rotate(-90 1152 478)">proposals</text>

  <!-- Bus to storage and services -->
  <line class="line" x1="935" y1="720" x2="935" y2="744"/>
  <line class="line" x1="222" y1="744" x2="1377" y2="744"/>
  <line class="line" x1="222" y1="744" x2="222" y2="768" marker-end="url(#a)"/>
  <line class="line" x1="607" y1="744" x2="607" y2="768" marker-end="url(#a)"/>
  <line class="line" x1="992" y1="744" x2="992" y2="768" marker-end="url(#a)"/>
  <line class="line" x1="1377" y1="744" x2="1377" y2="768" marker-end="url(#a)"/>

  <!-- Row C: storage and services -->
  <g>
    <rect class="ext" x="40" y="770" width="365" height="118" rx="10"/>
    <text class="t" x="56" y="796">Starter kit</text>
    <text class="s" x="56" y="818">synthetic cases, profiles,</text>
    <text class="s" x="56" y="836">messages, rules</text>
    <text class="m" x="56" y="868">read-only mount</text>

    <rect class="ext" x="425" y="770" width="365" height="118" rx="10"/>
    <text class="t" x="441" y="796">Anthropic API</text>
    <text class="s" x="441" y="818">Sonnet 5.5 reads documents</text>
    <text class="s" x="441" y="836">Opus 5.5 analyses the case</text>
    <text class="m" x="441" y="868">cached by sha256 + prompt version</text>

    <rect class="data" x="810" y="770" width="365" height="118" rx="10"/>
    <text class="t" x="826" y="796">PostgreSQL + pgvector</text>
    <text class="s" x="826" y="818">cases, documents, facts,</text>
    <text class="s" x="826" y="836">proposals, prompts, runs</text>
    <text class="m" x="826" y="868">filtered by case_id first</text>

    <rect class="data" x="1195" y="770" width="365" height="118" rx="10"/>
    <text class="t" x="1211" y="796">Audit ledger</text>
    <text class="s" x="1211" y="818">hash-chained, insert only,</text>
    <text class="s" x="1211" y="836">one chain per case</text>
    <text class="m" x="1211" y="868">any edit breaks verify</text>
  </g>

  <!-- Row D: pipeline -->
  <text class="h" x="40" y="932">One case, end to end</text>
  <text class="s" x="230" y="932">A new upload, message or event reruns the case. Human decisions stay.</text>
  <g>
    <path class="step" d="M40,948 h152 l18,24 l-18,24 h-152 z"/><text class="w" x="120" y="977">Ingest</text>
    <path class="step" d="M212,948 h152 l18,24 l-18,24 h-152 l18,-24 z"/><text class="w" x="297" y="977">Read pages</text>
    <path class="step" d="M384,948 h152 l18,24 l-18,24 h-152 l18,-24 z" style="fill:#5B3FB8"/><text class="w" x="469" y="977">Claude reads</text>
    <path class="step" d="M556,948 h152 l18,24 l-18,24 h-152 l18,-24 z"/><text class="w" x="641" y="977">Verify quotes</text>
    <path class="step" d="M728,948 h152 l18,24 l-18,24 h-152 l18,-24 z"/><text class="w" x="813" y="977">Facts</text>
    <path class="step" d="M900,948 h152 l18,24 l-18,24 h-152 l18,-24 z"/><text class="w" x="985" y="977">Conflicts</text>
    <path class="step" d="M1072,948 h152 l18,24 l-18,24 h-152 l18,-24 z"/><text class="w" x="1157" y="977">Proposals</text>
    <path class="step" d="M1244,948 h152 l18,24 l-18,24 h-152 l18,-24 z" style="fill:#9A6400"/><text class="w" x="1329" y="977">LEGAL review</text>
    <path class="step" d="M1416,948 h144 v48 h-144 l18,-24 z" style="fill:#15803D"/><text class="w" x="1494" y="977">Commit</text>
  </g>

  <!-- Guarantees -->
  <g>
    <rect class="chip" x="40" y="1024" width="292" height="56" rx="10"/>
    <text class="t" x="56" y="1047">No legal advice</text>
    <text class="s" x="56" y="1067">no eligibility or outcome predictions</text>

    <rect class="chip" x="347" y="1024" width="292" height="56" rx="10"/>
    <text class="t" x="363" y="1047">Nothing leaves the building</text>
    <text class="s" x="363" y="1067">DRAFT_NOT_SENT, NOT FOR FILING</text>

    <rect class="chip" x="654" y="1024" width="292" height="56" rx="10"/>
    <text class="t" x="670" y="1047">Claims never become facts</text>
    <text class="s" x="670" y="1067">conflicts go to a person with both sources</text>

    <rect class="chip" x="961" y="1024" width="292" height="56" rx="10"/>
    <text class="t" x="977" y="1047">Never crosses cases</text>
    <text class="s" x="977" y="1067">every query, search and chat takes case_id</text>

    <rect class="chip" x="1268" y="1024" width="292" height="56" rx="10"/>
    <text class="t" x="1284" y="1047">Every change is audited</text>
    <text class="s" x="1284" y="1067">denied attempts too, in the same transaction</text>
  </g>
</svg>
